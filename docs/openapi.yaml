      tags: [Order]
      summary: Detail order items by product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Success }

  /orders/groups:
    get:
      tags: [Order]
      summary: Aggregate order by outlets
      responses:
        '200': { description: Success }

  /orders/leftjoin/{id}:
    get:
      tags: [Order]
      summary: Left join product-order by outlet
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Success }

  /orders/{id}:
