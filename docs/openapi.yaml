      tags: [Order]
      summary: Get order detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Success }
    put:
      tags: [Order]
      summary: Update order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreatePayload'
      responses:
        '200': { description: Success }
    delete:
      tags: [Order]
      summary: Delete order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Success }

  /orders/{id}/with-product-id:
    get:
      tags: [Order]
      summary: Get order detail with product id fields
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Success }

  /orders/providers:
    post:
      tags: [Provider]
      summary: Create providers
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderMultiPayload'
      responses:
        '200': { description: Success }

  /orders/providers/single:
    post:
      tags: [Provider]
      summary: Create single provider
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_items_id]
              properties:
                order_items_id: { type: integer }
                quantity: { type: number }
                tanggal: { type: string, format: date-time }
                pic: { type: string }
      responses:
        '200': { description: Success }

  /orders/providers/multi:
    post:
      tags: [Provider]
      summary: Create multi providers
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderMultiPayload'
      responses:
        '200': { description: Success }

  /orders/providers/{id}:
    put:
      tags: [Provider]
      summary: Update provider
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
