      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: number }
                tanggal: { type: string, format: date-time }
                pic: { type: string }
      responses:
        '200': { description: Success }

  /delivery-orders/new:
    post:
      tags: [DeliveryOrder]
      summary: Create delivery order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryOrderCreatePayload'
      responses:
        '200': { description: Success }

  /delivery-orders/list:
    get:
      tags: [DeliveryOrder]
      summary: List delivery orders
      responses:
        '200': { description: Success }

  /delivery-orders/list/{outlet_id}:
    get:
      tags: [DeliveryOrder]
      summary: List delivery orders by outlet
      parameters:
        - in: path
          name: outlet_id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Success }

  /delivery-orders/{id}:
    get:
      tags: [DeliveryOrder]
      summary: Get delivery order detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Success }
    put:
      tags: [DeliveryOrder]
      summary: Update delivery order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryOrderCreatePayload'
      responses:
        '200': { description: Success }
    delete:
      tags: [DeliveryOrder]
      summary: Delete delivery order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
